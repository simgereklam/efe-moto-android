name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: APK Dosyasını Bul ve Yükle
        run: |
          # APK dosyasını tüm proje içinde ara ve yolunu bul
          APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
          
          if [ -z "$APK_FILE" ]; then
            echo "APK dosyası bulunamadı!"
            exit 1
          fi
          
          echo "Bulunan APK dosyası: $APK_FILE"
          
          # Bulunan dosyayı, yükleme adımının kesin olarak bulabileceği bir yere kopyala
          cp "$APK_FILE" ./MotoDiagPro.apk
          echo "APK dosyası ana dizine kopyalandı: ./MotoDiagPro.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoDiagPro-APK
          path: ./MotoDiagPro.apk
