name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoDiagPro-APK
          # Tüm klasörlerin içine bak, .apk ile biten ne varsa al (Kesin çözüm)
          path: "**/*.apk"
          if-no-files-found: error
